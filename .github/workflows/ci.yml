# CI de DonemosSC (T014).
#
# Jobs:
#   - guardrails:       documentos que reglamentan el proyecto presentes, sin secretos.
#   - lint:             ESLint + Prettier + astro check en los tres workspaces.
#   - test-backend:     Jest (unit + contract + integration). Las suites de
#                       integración levantan Postgres 16 efímero vía testcontainers
#                       (research §11) — por eso NO hay service container aquí.
#   - test-frontend:    Vitest (islas React) + Playwright/axe-core (E2E AAA).
#                       Los E2E corren solo cuando existen specs (llegan en US1).
#   - lighthouse-mobile: Performance ≥ 90 sobre el build estático (perfil móvil,
#                       el default de Lighthouse). T146 endurece budgets (a11y ≥ 95).
#   - build:            pnpm -r build (backend nest build + frontend astro build).
#
# Pendiente por plan: job openapi-check (T145, Fase 6).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails de documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar Constitución
        run: test -f .specify/memory/constitution.md

      - name: Verificar spec, plan, tasks
        run: |
          test -f specs/001-blood-donation-scheduling/spec.md
          test -f specs/001-blood-donation-scheduling/plan.md
          test -f specs/001-blood-donation-scheduling/tasks.md

      - name: Verificar quickstart y contratos
        run: |
          test -f specs/001-blood-donation-scheduling/quickstart.md
          test -d specs/001-blood-donation-scheduling/contracts

      - name: Verificar CONTRIBUTING y README
        run: |
          test -f CONTRIBUTING.md
          test -f README.md

      - name: Verificar que no haya secretos en el repo
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.[^e])'; then
            echo "❌ Se detectó un archivo .env commiteado. Rotar y eliminar."
            exit 1
          fi
          echo "✅ Sin .env commiteados."

      - name: Verificar que .claude/ esté ignorado
        run: |
          if git ls-files | grep -q "^\.claude/"; then
            echo "❌ .claude/ está trackeado. Debe estar en .gitignore."
            exit 1
          fi
          echo "✅ .claude/ correctamente ignorado."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test-backend:
    name: Test backend (unit + contract + integration)
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # unit y contract no tocan red; integration levanta Postgres efímero
      # con testcontainers usando el Docker del runner.
      - name: Test unit + contract
        env:
          JWT_SECRET: 'ci-secret-not-for-prod'
          REDACTION_PEPPER: 'ci-pepper-not-for-prod'
        run: |
          pnpm --filter backend test:unit
          pnpm --filter backend test:contract

      - name: Test integration (testcontainers)
        env:
          JWT_SECRET: 'ci-secret-not-for-prod'
          REDACTION_PEPPER: 'ci-pepper-not-for-prod'
        run: pnpm --filter backend test:integration

  test-frontend:
    name: Test frontend (Vitest + Playwright/axe)
    runs-on: ubuntu-latest
    needs: guardrails
    # Los E2E hablan con un backend real (Principio I: solo API propia). Levantamos
    # Postgres 16 como service para que backend pueda migrar/seedear en el mismo runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: donemos
          POSTGRES_PASSWORD: donemos
          POSTGRES_DB: donemos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U donemos -d donemos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: 'postgres://donemos:donemos@localhost:5432/donemos'
      JWT_SECRET: 'ci-secret-not-for-prod'
      REDACTION_PEPPER: 'ci-pepper-not-for-prod'
      ADMIN_USERNAME: 'admin'
      ADMIN_PASSWORD: 'admin1234'
      PORT: '3001'
      PUBLIC_API_BASE_URL: 'http://localhost:3001/api/v1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Vitest (componentes React)
        run: pnpm --filter frontend test

      # Los E2E (Playwright + @axe-core/playwright) llegan con US1 (T054+).
      # Detectamos specs para no arrancar Chromium ni backend en vano.
      - name: Detectar specs E2E
        id: e2e
        run: |
          if find frontend/test/e2e -type f \( -name '*.spec.ts' -o -name '*.e2e.ts' \) 2>/dev/null | grep -q .; then
            echo "existen=true" >> "$GITHUB_OUTPUT"
          else
            echo "existen=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Sin specs E2E todavía (llegan en US1)."
          fi

      - name: Instalar Chromium de Playwright
        if: steps.e2e.outputs.existen == 'true'
        run: pnpm --filter frontend test:e2e:install

      # Backend real para que los E2E puedan agendar, cancelar, login admin, etc.
      - name: Build backend + shared
        if: steps.e2e.outputs.existen == 'true'
        run: |
          pnpm --filter @donemos/shared build
          pnpm --filter backend build

      - name: Migrar + seedear Postgres
        if: steps.e2e.outputs.existen == 'true'
        run: |
          pnpm --filter backend exec prisma migrate deploy
          pnpm --filter backend exec prisma db seed

      - name: Start backend (background)
        if: steps.e2e.outputs.existen == 'true'
        run: |
          (pnpm --filter backend start > backend-e2e.log 2>&1 &)
          npx --yes wait-on http://localhost:3001/api/v1/health --timeout 60000

      - name: Build + preview frontend
        if: steps.e2e.outputs.existen == 'true'
        run: |
          pnpm --filter frontend build
          (pnpm --filter frontend preview &)
          npx --yes wait-on http://localhost:4321 --timeout 60000

      - name: Playwright E2E (con axe-core AAA)
        if: steps.e2e.outputs.existen == 'true'
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:4321'
          PLAYWRIGHT_API_BASE_URL: 'http://localhost:3001/api/v1'
          PLAYWRIGHT_ADMIN_USERNAME: 'admin'
          PLAYWRIGHT_ADMIN_PASSWORD: 'admin1234'
        run: pnpm --filter frontend exec playwright test

      - name: Subir log del backend E2E
        if: steps.e2e.outputs.existen == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: backend-e2e.log
          retention-days: 7

      - name: Subir reporte Playwright
        if: steps.e2e.outputs.existen == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lighthouse-mobile:
    name: Lighthouse mobile (Performance ≥ 90, A11y ≥ 95, Best Practices ≥ 90)
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      # Astro con adapter Node.js necesita servidor real para /agendar (SSR).
      # Boot en background + wait-on antes de auditar.
      - name: Preview frontend (server SSR)
        env:
          PUBLIC_API_BASE_URL: 'http://localhost:3000/api/v1'
        run: |
          (pnpm --filter frontend preview &)
          npx --yes wait-on http://localhost:4321 --timeout 60000

      # T146: Lighthouse mobile audita landing (/) y /agendar con budgets
      # Performance ≥ 0.9, Accessibility ≥ 0.95, Best Practices ≥ 0.9.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-report

  pa11y-contrast:
    name: pa11y contrast check (T150)
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Preview frontend
        env:
          PUBLIC_API_BASE_URL: 'http://localhost:3000/api/v1'
        run: |
          (pnpm --filter frontend preview &)
          npx --yes wait-on http://localhost:4321 --timeout 60000

      # pa11y aplica los criterios WCAG2AAA; verifica contrastes 7:1 (SC 1.4.6).
      # El config trae `--no-sandbox` para Chromium (Ubuntu 24.04 desactivó los
      # user-namespaces por defecto y Puppeteer no puede lanzar sandboxed).
      - name: pa11y sobre landing, /agendar y /admin/login
        run: |
          CONFIG=".github/pa11y/pa11y.config.json"
          npx --yes pa11y --standard WCAG2AAA --config "$CONFIG" http://localhost:4321/
          npx --yes pa11y --standard WCAG2AAA --config "$CONFIG" http://localhost:4321/agendar
          npx --yes pa11y --standard WCAG2AAA --config "$CONFIG" http://localhost:4321/admin/login

  openapi-check:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # T145: falla si el contrato público generado desde los esquemas Zod
      # diverge del commiteado (backend/contracts/public-api.generated.yaml).
      - name: Verificar contrato OpenAPI
        run: pnpm --filter @donemos/shared build && pnpm --filter backend openapi:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
